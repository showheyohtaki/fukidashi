<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>初回設定 2/3 あなたのこと</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Noto+Sans+JP:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0075DE}a:hover{color:#005BAB}
</style>
</helmet>
<div style="width: 400px; height: 860px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; color: #191918; font-family: Inter, 'Hiragino Sans', 'Noto Sans JP', system-ui, sans-serif; font-size: 14px; line-height: 1.5">

  <!-- ウィザードの上端（3画面共通・56px） -->
  <div style="height: 56px; flex: none; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; border-bottom: 1px solid rgba(0,0,0,0.08)">
    <span style="font-size: 13px; font-weight: 500; color: #615D59">フキダシの初回設定</span>
    <div style="display: flex; align-items: center; gap: 10px">
      <div role="img" aria-label="手順 2 / 3" style="display: flex; align-items: center; gap: 6px">
        <span style="width: 8px; height: 8px; border-radius: 9999px; background: #0075DE"></span>
        <span style="width: 22px; height: 8px; border-radius: 9999px; background: #0075DE"></span>
        <span style="width: 8px; height: 8px; box-sizing: border-box; border-radius: 9999px; border: 1.5px solid #A39E98"></span>
      </div>
      <span aria-hidden="true" style="font-size: 13px; font-weight: 600; color: #31302E; font-variant-numeric: tabular-nums">2 / 3</span>
    </div>
  </div>

  <!-- 本文（3画面共通の余白） -->
  <div style="flex: 1; min-height: 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px; padding: 24px 24px 16px">
    <h1 style="margin: 0; font-size: 20px; font-weight: 600; line-height: 1.4; color: #191918">あなたのこと</h1>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="yourname" style="font-size: 13px; font-weight: 600; color: #191918">名前（相手に伝える呼び方）</label>
      <input id="yourname" type="text" value="山田" style="display: block; width: 100%; box-sizing: border-box; height: 44px; padding: 0 12px; border: 1px solid rgba(0,0,0,0.1); border-radius: 6px; font: inherit; font-size: 15px; color: #191918; background: #FFFFFF; outline: none">
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="yourjob" style="font-size: 13px; font-weight: 600; color: #191918">仕事</label>
      <input id="yourjob" type="text" value="Web デザイナー（ホームページ制作）" style="display: block; width: 100%; box-sizing: border-box; height: 44px; padding: 0 12px; border: 1px solid rgba(0,0,0,0.1); border-radius: 6px; font: inherit; font-size: 15px; color: #191918; background: #FFFFFF; outline: none">
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="yournote" style="font-size: 13px; font-weight: 600; color: #191918">補足（任意・1〜2 行）</label>
      <textarea id="yournote" rows="2" placeholder="例）女性向けのやわらかいデザインが得意" style="display: block; width: 100%; box-sizing: border-box; height: 64px; resize: none; padding: 10px 12px; border: 1px solid rgba(0,0,0,0.1); border-radius: 6px; font: inherit; font-size: 15px; line-height: 1.45; color: #191918; background: #FFFFFF; outline: none">女性向けのやわらかいデザインが得意です。</textarea>
      <span style="font-size: 12px; line-height: 1.6; color: #615D59">返事の候補づくりに使います。会議ごとの議題は、会議の開始前の画面で入れます。</span>
      <!-- 今日の項目は一覧の画面で見る・直す（ここでは作らない。作るのは開始前の画面） -->
      <button style="align-self: flex-start; height: 36px; margin: 0 0 0 -6px; padding: 0 6px; display: flex; align-items: center; gap: 6px; border: none; background: transparent; color: #0075DE; border-radius: 6px; font: inherit; font-size: 13px; font-weight: 500; text-align: left; cursor: pointer">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h11"></path><path d="M9 12h11"></path><path d="M9 18h11"></path><path d="M3.5 6l1.2 1.2L7 5"></path><path d="M3.5 12l1.2 1.2L7 11"></path><circle cx="5" cy="18" r="1.3"></circle></svg>今日の項目（聞くこと）を見る・直す（今 7 問）<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="margin-left: -4px"><path d="M9 6l6 6-6 6"></path></svg>
      </button>
    </div>

    <!-- はじめの一言のプレビュー（会議中の「自分の発言」と同じ形） -->
    <div style="box-sizing: border-box; display: flex; flex-direction: column; gap: 8px; padding: 4px 14px 14px; background: #F6F5F4; border: 1px solid rgba(0,0,0,0.06); border-radius: 12px">
      <div style="display: flex; align-items: center; justify-content: space-between">
        <span style="display: flex; flex-direction: column">
          <span style="font-size: 13px; font-weight: 600; color: #191918">はじめの一言</span>
          <span style="font-size: 12px; color: #615D59">名前から自動で組んでいます</span>
        </span>
        <button style="height: 44px; margin-right: -8px; padding: 0 8px; display: flex; align-items: center; gap: 4px; border: none; background: transparent; color: #0075DE; border-radius: 6px; font: inherit; font-size: 13px; font-weight: 500; cursor: pointer">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16v4z"></path><path d="M13.5 6.5l4 4"></path></svg>編集
        </button>
      </div>
      <div style="background: #F2F9FF; border: 1px solid #DCEBFA; border-radius: 12px 12px 4px 12px; padding: 10px 12px">
        <p style="margin: 0; font-size: 14px; line-height: 1.6; color: #31302E">はじめまして、山田と申します。本日はお時間をいただき、ありがとうございます。耳が聞こえないため、お話しいただいた内容を文字起こしで読み、AI の声でお返事しております。お返事に少しお時間をいただくことがありますが、どうぞよろしくお願いいたします。</p>
      </div>
    </div>
  </div>

  <!-- ウィザードの下端（3画面共通・76px） -->
  <div style="height: 76px; flex: none; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; border-top: 1px solid rgba(0,0,0,0.08)">
    <button style="min-width: 96px; height: 44px; padding: 0 16px; border: 1px solid rgba(0,0,0,0.1); background: #FFFFFF; color: #31302E; border-radius: 6px; font: inherit; font-size: 15px; font-weight: 500; cursor: pointer">あとで</button>
    <button style="min-width: 156px; height: 44px; padding: 0 18px; border: none; background: #0075DE; color: #FFFFFF; border-radius: 6px; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer">次へ</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":400,"height":860}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
