<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>初回設定 3/3 声の確認</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Noto+Sans+JP:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0075DE}a:hover{color:#005BAB}
</style>
</helmet>
<div style="width: 400px; height: 860px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; color: #191918; font-family: Inter, 'Hiragino Sans', 'Noto Sans JP', system-ui, sans-serif; font-size: 14px; line-height: 1.5">

  <!-- ウィザードの上端（3画面共通・56px） -->
  <div style="height: 56px; flex: none; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; border-bottom: 1px solid rgba(0,0,0,0.08)">
    <span style="font-size: 13px; font-weight: 500; color: #615D59">フキダシの初回設定</span>
    <div style="display: flex; align-items: center; gap: 10px">
      <div role="img" aria-label="手順 3 / 3" style="display: flex; align-items: center; gap: 6px">
        <span style="width: 8px; height: 8px; border-radius: 9999px; background: #0075DE"></span>
        <span style="width: 8px; height: 8px; border-radius: 9999px; background: #0075DE"></span>
        <span style="width: 22px; height: 8px; border-radius: 9999px; background: #0075DE"></span>
      </div>
      <span aria-hidden="true" style="font-size: 13px; font-weight: 600; color: #31302E; font-variant-numeric: tabular-nums">3 / 3</span>
    </div>
  </div>

  <!-- 本文（3画面共通の余白） -->
  <div style="flex: 1; min-height: 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px; padding: 28px 24px 20px">
    <h1 style="margin: 0; font-size: 20px; font-weight: 600; line-height: 1.4; color: #191918">あなたの代わりに話す声</h1>

    <!-- 既定の声のカード（選択中） -->
    <div style="box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; padding: 14px; border: 2px solid #0075DE; border-radius: 12px; background: #FFFFFF; box-shadow: rgba(0,0,0,0.03) 0px 2px 6px">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
        <span style="display: flex; align-items: center; gap: 10px; min-width: 0">
          <span style="width: 40px; height: 40px; flex: none; border-radius: 20px; background: #0075DE; display: flex; align-items: center; justify-content: center">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10v4"></path><path d="M8 7v10"></path><path d="M12 4v16"></path><path d="M16 8v8"></path><path d="M20 11v2"></path></svg>
          </span>
          <span style="font-size: 17px; font-weight: 600; color: #191918">marin<span style="font-size: 13px; font-weight: 400; color: #615D59">（既定）</span></span>
        </span>
        <button aria-pressed="true" style="height: 44px; flex: none; padding: 0 12px; display: flex; align-items: center; gap: 6px; border: 1px solid #DCEBFA; background: #F2F9FF; color: #005BAB; border-radius: 6px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#005BAB" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>この声にする
        </button>
      </div>
      <p style="margin: 0; font-size: 14px; line-height: 1.6; color: #31302E">落ち着いた、やわらかい声。デイトラが聞いて選びました</p>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <button style="height: 44px; width: 100%; box-sizing: border-box; padding: 0 12px; display: flex; align-items: center; gap: 10px; border: 1px solid rgba(0,0,0,0.1); background: #FFFFFF; color: #191918; border-radius: 6px; font: inherit; font-size: 14px; font-weight: 500; text-align: left; cursor: pointer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#31302E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H3v6h3l5 4V5z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7"></path><path d="M18.5 5.5a9 9 0 0 1 0 13"></path></svg>
          <span style="flex: 1">サンプルをこのパソコンで鳴らす</span>
        </button>
        <button style="height: 44px; width: 100%; box-sizing: border-box; padding: 0 12px; display: flex; align-items: center; gap: 10px; border: 1px solid rgba(0,0,0,0.1); background: #FFFFFF; color: #191918; border-radius: 6px; font: inherit; font-size: 14px; font-weight: 500; text-align: left; cursor: pointer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#31302E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11"></path><path d="M7.5 10.5L12 15l4.5-4.5"></path><path d="M5 19h14"></path></svg>
          <span style="flex: 1">サンプルを音声ファイルで保存</span>
          <span style="font-size: 12px; font-weight: 400; color: #615D59">.wav</span>
        </button>
      </div>
    </div>

    <!-- 本人は聞けなくても大丈夫 -->
    <div style="display: flex; align-items: flex-start; gap: 8px; padding: 12px; background: #F6F5F4; border-radius: 12px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#615D59" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 2px"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5.5"></path><path d="M12 7.6v.01"></path></svg>
      <p style="margin: 0; font-size: 12px; line-height: 1.65; color: #31302E">あなた自身は聞けなくても大丈夫です。そのまま使えます。別の声にしたいときは、身近な人にサンプルを聞いてもらって選んでください。</p>
    </div>

    <a href="#" style="height: 44px; margin-top: -10px; display: flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 500; text-decoration: none; align-self: flex-start">ほかの声を見る<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a>

    <!-- 作り置きの進み具合 -->
    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; align-items: baseline; justify-content: space-between">
        <span id="prep-label" style="font-size: 13px; color: #191918">よく使う言葉の声を準備しています…</span>
        <span style="font-size: 13px; font-weight: 600; color: #191918; font-variant-numeric: tabular-nums">4 / 12</span>
      </div>
      <div role="progressbar" aria-labelledby="prep-label" aria-valuenow="4" aria-valuemin="0" aria-valuemax="12" style="height: 6px; border-radius: 9999px; background: rgba(0,0,0,0.08); overflow: hidden">
        <div style="width: 33.3%; height: 6px; border-radius: 9999px; background: #0075DE"></div>
      </div>
      <span style="font-size: 12px; color: #615D59">終わらなくても次へ進めます。</span>
    </div>
  </div>

  <!-- ウィザードの下端（3画面共通・76px） -->
  <div style="height: 76px; flex: none; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; border-top: 1px solid rgba(0,0,0,0.08)">
    <button style="min-width: 96px; height: 44px; padding: 0 16px; border: 1px solid rgba(0,0,0,0.1); background: #FFFFFF; color: #31302E; border-radius: 6px; font: inherit; font-size: 15px; font-weight: 500; cursor: pointer">あとで</button>
    <button style="min-width: 156px; height: 44px; padding: 0 18px; border: none; background: #0075DE; color: #FFFFFF; border-radius: 6px; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer">はじめる</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":400,"height":860}}'>

  renderVals() {
    return {};
  }

</script>
</body>
</html>
