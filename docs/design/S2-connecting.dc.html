<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>接続中</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Noto+Sans+JP:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0075DE}a:hover{color:#005BAB}
</style>
</helmet>
<div style="width: 400px; height: 860px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; color: #191918; font-family: Inter, 'Hiragino Sans', 'Noto Sans JP', system-ui, sans-serif; font-size: 14px; line-height: 1.5">

  <!-- 1. 状態バー（中立：灰の帯と丸＋回る円・右はメニューだけ） -->
  <div role="status" style="height: 56px; flex: none; box-sizing: border-box; display: flex; align-items: center; gap: 10px; padding: 0 6px 0 0; background: #F6F5F4; border-bottom: 1px solid rgba(0,0,0,0.08)">
    <div style="width: 6px; align-self: stretch; background: #A39E98"></div>
    <div style="width: 28px; height: 28px; border-radius: 14px; background: #A39E98; display: flex; align-items: center; justify-content: center; flex: none; margin-left: 4px">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-4-6.9"></path></svg>
    </div>
    <div style="flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 8px">
      <span style="font-size: 15px; font-weight: 600; color: #615D59">つないでいます…</span>
      <span style="font-size: 13px; font-weight: 600; color: #615D59; font-variant-numeric: tabular-nums">1 / 3</span>
    </div>
    <button aria-label="メニュー（設定・会話を停止）" title="設定・会話を停止" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: none; background: transparent; border-radius: 6px; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#615D59" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg>
    </button>
  </div>

  <!-- 接続の3つ（下の一覧と同じ印・同じ順。つながり終わるとこの行だけが残る） -->
  <div id="conn-row" style="height: 24px; flex: none; box-sizing: border-box; display: flex; align-items: center; gap: 14px; padding: 0 14px; border-bottom: 1px solid rgba(0,0,0,0.06); font-size: 11px; color: #615D59; white-space: nowrap">
    <span style="display: flex; align-items: center; gap: 4px"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#1F7F7B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>字幕</span>
    <span style="display: flex; align-items: center; gap: 4px"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#615D59" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-4-6.9"></path></svg>声</span>
    <span style="display: flex; align-items: center; gap: 4px"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#A39E98" stroke-width="2.6" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle></svg>会議のマイク</span>
    <span style="margin-left: auto">Google Meet</span>
  </div>

  <!-- 2. 字幕エリア（中央に接続の一覧） -->
  <div aria-live="polite" style="flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: center; gap: 10px; padding: 14px 16px 12px">
    <div style="box-sizing: border-box; display: flex; flex-direction: column; gap: 4px; padding: 12px 12px 12px; border: 1px solid rgba(0,0,0,0.1); border-radius: 12px; background: #FFFFFF; box-shadow: rgba(0,0,0,0.03) 0px 2px 6px">
      <!-- 進み具合 -->
      <div style="display: flex; align-items: center; gap: 10px; padding: 0 4px 8px">
        <span style="flex: none; font-size: 13px; font-weight: 600; color: #31302E">接続の確認</span>
        <div role="progressbar" aria-label="接続の進み具合" aria-valuenow="1" aria-valuemin="0" aria-valuemax="3" style="flex: 1; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px">
          <span style="height: 6px; border-radius: 9999px; background: #1F7F7B"></span>
          <span style="height: 6px; border-radius: 9999px; background: #A39E98"></span>
          <span style="height: 6px; border-radius: 9999px; background: rgba(0,0,0,0.08)"></span>
        </div>
        <span style="flex: none; font-size: 13px; font-weight: 600; color: #31302E; font-variant-numeric: tabular-nums">1 / 3</span>
      </div>

      <!-- 済み: 字幕 -->
      <div style="height: 48px; box-sizing: border-box; display: flex; align-items: center; gap: 10px; padding: 0 10px; border-radius: 6px">
        <span aria-hidden="true" style="width: 22px; height: 22px; flex: none; border-radius: 11px; background: #1F7F7B; display: flex; align-items: center; justify-content: center">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
        </span>
        <span style="flex: 1; min-width: 0; font-size: 14px; color: #191918">字幕（相手の声を文字にする）</span>
        <span style="flex: none; font-size: 12px; font-weight: 600; color: #1C6B68">完了</span>
      </div>

      <!-- 確認中: 声 -->
      <div style="height: 48px; box-sizing: border-box; display: flex; align-items: center; gap: 10px; padding: 0 10px; border-radius: 6px; background: #F6F5F4">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" aria-hidden="true" style="flex: none"><circle cx="12" cy="12" r="9" stroke="rgba(0,0,0,0.1)"></circle><path d="M21 12a9 9 0 0 0-9-9" stroke="#615D59"></path></svg>
        <span style="flex: 1; min-width: 0; font-size: 14px; font-weight: 600; color: #191918">声（AI の声）</span>
        <span style="flex: none; font-size: 12px; font-weight: 600; color: #615D59">確認中</span>
      </div>

      <!-- このあと: 会議のマイク -->
      <div style="height: 48px; box-sizing: border-box; display: flex; align-items: center; gap: 10px; padding: 0 10px; border-radius: 6px">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#A39E98" stroke-width="2" aria-hidden="true" style="flex: none"><circle cx="12" cy="12" r="9"></circle></svg>
        <span style="flex: 1; min-width: 0; font-size: 14px; color: #615D59">会議のマイク（会議に声を送る）</span>
        <span style="flex: none; font-size: 12px; color: #615D59">このあと</span>
      </div>
    </div>

    <!-- 畳まれ方の説明 -->
    <p style="margin: 0; display: flex; align-items: flex-start; gap: 6px; padding: 0 4px; font-size: 12px; line-height: 1.6; color: #615D59">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#615D59" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 2px"><path d="M12 19V5"></path><path d="M6 11l6-6 6 6"></path></svg>
      <span>3 つともつながると、この一覧は消え、いちばん上の「字幕・声・会議のマイク」の行にまとまります。</span>
    </p>
  </div>

  <!-- 3. 候補エリア（まだ空・枠だけ。位置と大きさは Main と同じ） -->
  <div style="flex: none; border-top: 1px solid rgba(0,0,0,0.08); padding: 8px 12px 10px; background: #F6F5F4">
    <div style="height: 24px; display: flex; align-items: center; justify-content: space-between; padding: 0 2px">
      <span style="font-size: 13px; font-weight: 500; color: #615D59">返事の候補</span>
      <span style="font-size: 12px; color: #615D59">つながると出ます</span>
    </div>
    <div aria-hidden="true" style="display: flex; flex-direction: column; gap: 6px; margin-top: 4px">
      <div style="height: 52px; box-sizing: border-box; border: 1px dashed rgba(0,0,0,0.14); border-radius: 12px"></div>
      <div style="height: 52px; box-sizing: border-box; border: 1px dashed rgba(0,0,0,0.14); border-radius: 12px"></div>
      <div style="height: 52px; box-sizing: border-box; border: 1px dashed rgba(0,0,0,0.14); border-radius: 12px"></div>
    </div>
  </div>

  <!-- 4. 相づち行（声がつながるまで押せない） -->
  <div style="height: 56px; flex: none; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; gap: 2px; padding: 0 6px; border-top: 1px solid rgba(0,0,0,0.08); white-space: nowrap">
    <button disabled title="「はい。」を読み上げ（⌥4）" style="height: 44px; flex: none; padding: 0 6px 0 4px; display: flex; align-items: center; gap: 3px; border: 1px solid rgba(0,0,0,0.06); background: #F6F5F4; border-radius: 9999px; font: inherit; font-size: 12px; font-weight: 500; color: #8A857F"><span style="width: 15px; height: 15px; border-radius: 8px; background: #FFFFFF; border: 1px solid rgba(0,0,0,0.06); color: #8A857F; font-size: 11px; display: flex; align-items: center; justify-content: center">4</span>はい</button>
    <button disabled title="「承知いたしました。」を読み上げ（⌥5）" style="height: 44px; flex: none; padding: 0 6px 0 4px; display: flex; align-items: center; gap: 3px; border: 1px solid rgba(0,0,0,0.06); background: #F6F5F4; border-radius: 9999px; font: inherit; font-size: 12px; font-weight: 500; color: #8A857F"><span style="width: 15px; height: 15px; border-radius: 8px; background: #FFFFFF; border: 1px solid rgba(0,0,0,0.06); color: #8A857F; font-size: 11px; display: flex; align-items: center; justify-content: center">5</span>承知しました</button>
    <button disabled title="「ありがとうございます。」を読み上げ（⌥6）" style="height: 44px; flex: none; padding: 0 6px 0 4px; display: flex; align-items: center; gap: 3px; border: 1px solid rgba(0,0,0,0.06); background: #F6F5F4; border-radius: 9999px; font: inherit; font-size: 12px; font-weight: 500; color: #8A857F"><span style="width: 15px; height: 15px; border-radius: 8px; background: #FFFFFF; border: 1px solid rgba(0,0,0,0.06); color: #8A857F; font-size: 11px; display: flex; align-items: center; justify-content: center">6</span>ありがとう</button>
    <button disabled title="「少々お待ちください。」を読み上げ（⌥7）" style="height: 44px; flex: none; padding: 0 6px 0 4px; display: flex; align-items: center; gap: 3px; border: 1px solid rgba(0,0,0,0.06); background: #F6F5F4; border-radius: 9999px; font: inherit; font-size: 12px; font-weight: 500; color: #8A857F"><span style="width: 15px; height: 15px; border-radius: 8px; background: #FFFFFF; border: 1px solid rgba(0,0,0,0.06); color: #8A857F; font-size: 11px; display: flex; align-items: center; justify-content: center">7</span>お待ちください</button>
  </div>

  <!-- 5. 入力行（打てるが、話すは声がつながるまで押せない） -->
  <div style="flex: none; box-sizing: border-box; display: flex; align-items: flex-end; gap: 6px; padding: 8px 12px 12px; border-top: 1px solid rgba(0,0,0,0.08)">
    <button aria-label="はじめの一言を読み上げる" title="はじめの一言を読み上げる（⌥0）" style="width: 44px; height: 44px; flex: none; border: 1px solid rgba(0,0,0,0.1); background: #FFFFFF; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#31302E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-4.9A8 8 0 1 1 21 12z"></path><path d="M9.5 10.5v-1a1 1 0 0 1 2 0v3"></path><path d="M11.5 11v-2a1 1 0 0 1 2 0v3.5a2.5 2.5 0 0 1-5 0V12"></path></svg>
    </button>
    <button aria-label="ヒアリングで聞くこと（残り7項目）" title="ヒアリングで聞くこと（⌥H）" style="position: relative; width: 44px; height: 44px; flex: none; border: 1px solid rgba(0,0,0,0.1); background: #FFFFFF; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#31302E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h11"></path><path d="M9 12h11"></path><path d="M9 18h11"></path><path d="M3.5 6l1.2 1.2L7 5"></path><path d="M3.5 12l1.2 1.2L7 11"></path><circle cx="5" cy="18" r="1.3"></circle></svg>
      <span style="position: absolute; top: -7px; right: -9px; height: 18px; padding: 0 5px; box-sizing: border-box; border-radius: 9999px; background: #F6F5F4; border: 1px solid rgba(0,0,0,0.1); color: #31302E; font-size: 11px; font-weight: 500; display: flex; align-items: center; white-space: nowrap">残7</span>
    </button>
    <label style="flex: 1; min-width: 0; display: block">
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">読み上げる文</span>
      <textarea rows="1" placeholder="打って Enter で読み上げ" title="Enter で読み上げ／Shift+Enter で改行" style="display: block; width: 100%; box-sizing: border-box; height: 44px; resize: none; border: 1px solid rgba(0,0,0,0.1); border-radius: 6px; padding: 11px 10px; font: inherit; font-size: 15px; line-height: 1.4; color: #191918; background: #FFFFFF; outline: none"></textarea>
    </label>
    <button disabled title="声がつながると押せます" style="height: 44px; padding: 0 16px; flex: none; border: none; background: rgba(0,0,0,0.06); color: #8A857F; border-radius: 6px; font: inherit; font-size: 15px; font-weight: 600">話す</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":400,"height":860}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
