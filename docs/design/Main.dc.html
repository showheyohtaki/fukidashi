<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>会議中・相手が待っている</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Noto+Sans+JP:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0075DE}a:hover{color:#005BAB}
</style>
</helmet>
<div style="width: 400px; height: 860px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; color: #191918; font-family: Inter, 'Hiragino Sans', 'Noto Sans JP', system-ui, sans-serif; font-size: 14px; line-height: 1.5">

  <!-- 1. 状態バー：左に実色の帯・実色の丸のアイコン・右はメニューだけ -->
  <div role="status" style="height: 56px; box-sizing: border-box; display: flex; align-items: center; gap: 10px; padding: 0 6px 0 0; background: #EEF7F6; border-bottom: 1px solid rgba(0,0,0,0.08)">
    <div style="width: 6px; align-self: stretch; background: #1F7F7B"></div>
    <div style="width: 28px; height: 28px; border-radius: 14px; background: #1F7F7B; display: flex; align-items: center; justify-content: center; flex: none; margin-left: 4px">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8.5a6 6 0 0 1 12 0c0 3.5-3 4.5-3 7.5a3 3 0 0 1-5.6 1.5"></path><path d="M9 9a3 3 0 0 1 6 0"></path></svg>
    </div>
    <div style="flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 8px">
      <span style="font-size: 15px; font-weight: 600; color: #1C6B68">相手が待っています</span>
      <span style="font-size: 20px; font-weight: 600; color: #1C6B68; font-variant-numeric: tabular-nums">3<span style="font-size: 13px; margin-left: 2px">秒</span></span>
    </div>
    <button aria-label="メニュー（設定・会話を停止）" title="設定・会話を停止" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: none; background: transparent; border-radius: 6px; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#615D59" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg>
    </button>
  </div>

  <!-- 接続の3つ -->
  <div style="height: 24px; box-sizing: border-box; display: flex; align-items: center; gap: 14px; padding: 0 14px; border-bottom: 1px solid rgba(0,0,0,0.06); font-size: 11px; color: #615D59">
    <span style="display: flex; align-items: center; gap: 4px"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#1F7F7B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>字幕</span>
    <span style="display: flex; align-items: center; gap: 4px"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#1F7F7B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>声</span>
    <span style="display: flex; align-items: center; gap: 4px"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#1F7F7B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>会議のマイク</span>
    <span style="margin-left: auto">Google Meet</span>
  </div>

  <!-- 2. 字幕エリア
       相手の字幕の上に、話した人の名前（13px・600・muted・下に 4px）。字幕本文（19px・濃い黒）より小さく薄くし、誰の発言かだけ分かるようにする。
       同じ人が続く字幕では名前を省く（10:03 の2つ目）。自分の吹き出し（AI の声で送った文）には名前を出さない。 -->
  <div aria-live="polite" style="flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; gap: 14px; padding: 14px 16px 12px">
    <div style="align-self: flex-end; max-width: 88%; background: #F2F9FF; border: 1px solid #DCEBFA; border-radius: 12px 12px 4px 12px; padding: 8px 12px">
      <div style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #005BAB; margin-bottom: 2px; font-variant-numeric: tabular-nums">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#005BAB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H3v6h3l5 4V5z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7"></path></svg>10:02
      </div>
      <div style="font-size: 14px; line-height: 1.55; color: #31302E">はじめまして、山田と申します。本日はお時間をいただき、ありがとうございます。耳が聞こえないため、お話しいただいた内容を文字起こしで読み、AI の声でお返事しております。お返事に少しお時間をいただくことがありますが、どうぞよろしくお願いいたします。</div>
    </div>
    <div>
      <h3 style="margin: 0 0 4px; font-size: 13px; font-weight: 600; line-height: 1.4; color: #615D59">佐藤</h3>
      <div style="font-size: 12px; color: #615D59; margin-bottom: 2px; font-variant-numeric: tabular-nums">10:02</div>
      <div style="font-size: 19px; line-height: 1.55; color: #191918">わかりました、ありがとうございます。</div>
    </div>
    <div>
      <div style="font-size: 12px; color: #615D59; margin-bottom: 2px; font-variant-numeric: tabular-nums">10:03</div>
      <div style="font-size: 19px; line-height: 1.55; color: #191918">実はいまのホームページが10年前に作ったもので、スマホで見るとすごく見づらいって言われるんですよね。</div>
    </div>
  </div>

  <!-- 3. 候補エリア（暖かい白の面） -->
  <div style="border-top: 1px solid rgba(0,0,0,0.08); padding: 8px 12px 10px; background: #F6F5F4">
    <div style="height: 24px; display: flex; align-items: center; justify-content: space-between; padding: 0 2px">
      <span style="font-size: 13px; font-weight: 500; color: #615D59">返事の候補</span>
      <a href="#" style="font-size: 13px; font-weight: 500; text-decoration: none; display: flex; align-items: center; gap: 4px">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"></path><path d="M20 4v7h-7"></path></svg>出し直す<span style="font-size: 11px; color: #615D59; margin-left: 2px">⌥R</span>
      </a>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px; margin-top: 4px">
      <div style="display: flex; align-items: stretch; gap: 6px">
        <button style="flex: 1; min-height: 52px; display: flex; align-items: center; gap: 8px; padding: 6px 10px; border: 1px solid rgba(0,0,0,0.1); background: #FFFFFF; border-radius: 12px; font: inherit; text-align: left; cursor: pointer; box-shadow: rgba(0,0,0,0.03) 0px 2px 6px">
          <span style="display: flex; flex-direction: column; align-items: center; gap: 1px; flex: none; width: 26px">
            <span style="width: 24px; height: 24px; border-radius: 12px; background: #0075DE; color: #FFFFFF; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center">1</span>
            <span style="font-size: 11px; color: #615D59; white-space: nowrap">⌥1</span>
          </span>
          <span style="flex: 1; font-size: 15px; line-height: 1.4; color: #191918">それは気になりますね。どのあたりが見づらいと言われますか？</span>
          <span title="押すとすぐ声が出ます" style="flex: none; font-size: 12px; font-weight: 600; letter-spacing: 0.125px; color: #1C6B68; background: #EEF7F6; border-radius: 9999px; padding: 2px 8px">即</span>
        </button>
        <button style="width: 48px; flex: none; border: 1px solid rgba(0,0,0,0.1); background: #FFFFFF; color: #31302E; border-radius: 12px; font: inherit; font-size: 13px; font-weight: 500; cursor: pointer">直す</button>
      </div>
      <div style="display: flex; align-items: stretch; gap: 6px">
        <button style="flex: 1; min-height: 52px; display: flex; align-items: center; gap: 8px; padding: 6px 10px; border: 1px solid rgba(0,0,0,0.1); background: #FFFFFF; border-radius: 12px; font: inherit; text-align: left; cursor: pointer; box-shadow: rgba(0,0,0,0.03) 0px 2px 6px">
          <span style="display: flex; flex-direction: column; align-items: center; gap: 1px; flex: none; width: 26px">
            <span style="width: 24px; height: 24px; border-radius: 12px; background: #0075DE; color: #FFFFFF; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center">2</span>
            <span style="font-size: 11px; color: #615D59; white-space: nowrap">⌥2</span>
          </span>
          <span style="flex: 1; font-size: 15px; line-height: 1.4; color: #191918">スマホでの見やすさを一番に直したい、ということですね。</span>
          <span title="押すとすぐ声が出ます" style="flex: none; font-size: 12px; font-weight: 600; letter-spacing: 0.125px; color: #1C6B68; background: #EEF7F6; border-radius: 9999px; padding: 2px 8px">即</span>
        </button>
        <button style="width: 48px; flex: none; border: 1px solid rgba(0,0,0,0.1); background: #FFFFFF; color: #31302E; border-radius: 12px; font: inherit; font-size: 13px; font-weight: 500; cursor: pointer">直す</button>
      </div>
      <div style="display: flex; align-items: stretch; gap: 6px">
        <button style="flex: 1; min-height: 52px; display: flex; align-items: center; gap: 8px; padding: 6px 10px; border: 1px solid rgba(0,0,0,0.1); background: #FFFFFF; border-radius: 12px; font: inherit; text-align: left; cursor: pointer; box-shadow: rgba(0,0,0,0.03) 0px 2px 6px">
          <span style="display: flex; flex-direction: column; align-items: center; gap: 1px; flex: none; width: 26px">
            <span style="width: 24px; height: 24px; border-radius: 12px; background: #0075DE; color: #FFFFFF; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center">3</span>
            <span style="font-size: 11px; color: #615D59; white-space: nowrap">⌥3</span>
          </span>
          <span style="flex: 1; font-size: 15px; line-height: 1.4; color: #191918">一度いまのサイトを拝見して、直す所を整理しますね。</span>
          <span aria-hidden="true" style="flex: none; width: 26px"></span>
        </button>
        <button style="width: 48px; flex: none; border: 1px solid rgba(0,0,0,0.1); background: #FFFFFF; color: #31302E; border-radius: 12px; font: inherit; font-size: 13px; font-weight: 500; cursor: pointer">直す</button>
      </div>
    </div>
  </div>

  <!-- 4. 相づち行（4つ・番号つき）。400px 幅では実装の詰めた値（行の左右 6px・間 2px・ボタン 12px）で、語の途中で折り返さず1行に並べる -->
  <div style="height: 56px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; gap: 2px; padding: 0 6px; border-top: 1px solid rgba(0,0,0,0.08); white-space: nowrap">
    <button title="「はい。」を読み上げ（⌥4）" style="flex: none; height: 44px; padding: 0 7px 0 4px; display: flex; align-items: center; gap: 3px; border: 1px solid rgba(0,0,0,0.1); background: #FFFFFF; border-radius: 9999px; font: inherit; font-size: 12px; font-weight: 500; line-height: 1.2; white-space: nowrap; color: #191918; cursor: pointer"><span style="width: 15px; height: 15px; flex: none; border-radius: 8px; background: #F6F5F4; border: 1px solid rgba(0,0,0,0.08); color: #615D59; font-size: 11px; display: flex; align-items: center; justify-content: center">4</span>はい</button>
    <button title="「承知いたしました。」を読み上げ（⌥5）" style="flex: none; height: 44px; padding: 0 7px 0 4px; display: flex; align-items: center; gap: 3px; border: 1px solid rgba(0,0,0,0.1); background: #FFFFFF; border-radius: 9999px; font: inherit; font-size: 12px; font-weight: 500; line-height: 1.2; white-space: nowrap; color: #191918; cursor: pointer"><span style="width: 15px; height: 15px; flex: none; border-radius: 8px; background: #F6F5F4; border: 1px solid rgba(0,0,0,0.08); color: #615D59; font-size: 11px; display: flex; align-items: center; justify-content: center">5</span>承知しました</button>
    <button title="「ありがとうございます。」を読み上げ（⌥6）" style="flex: none; height: 44px; padding: 0 7px 0 4px; display: flex; align-items: center; gap: 3px; border: 1px solid rgba(0,0,0,0.1); background: #FFFFFF; border-radius: 9999px; font: inherit; font-size: 12px; font-weight: 500; line-height: 1.2; white-space: nowrap; color: #191918; cursor: pointer"><span style="width: 15px; height: 15px; flex: none; border-radius: 8px; background: #F6F5F4; border: 1px solid rgba(0,0,0,0.08); color: #615D59; font-size: 11px; display: flex; align-items: center; justify-content: center">6</span>ありがとう</button>
    <button title="「少々お待ちください。」を読み上げ（⌥7）" style="flex: none; height: 44px; padding: 0 7px 0 4px; display: flex; align-items: center; gap: 3px; border: 1px solid rgba(0,0,0,0.1); background: #FFFFFF; border-radius: 9999px; font: inherit; font-size: 12px; font-weight: 500; line-height: 1.2; white-space: nowrap; color: #191918; cursor: pointer"><span style="width: 15px; height: 15px; flex: none; border-radius: 8px; background: #F6F5F4; border: 1px solid rgba(0,0,0,0.08); color: #615D59; font-size: 11px; display: flex; align-items: center; justify-content: center">7</span>お待ちください</button>
  </div>

  <!-- 5. 入力行 -->
  <div style="box-sizing: border-box; display: flex; align-items: flex-end; gap: 6px; padding: 8px 12px 12px; border-top: 1px solid rgba(0,0,0,0.08)">
    <button aria-label="はじめの一言を読み上げる" title="はじめの一言（⌥0）" style="width: 44px; height: 44px; flex: none; border: 1px solid rgba(0,0,0,0.1); background: #FFFFFF; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#31302E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-4.9A8 8 0 1 1 21 12z"></path><path d="M9.5 10.5v-1a1 1 0 0 1 2 0v3"></path><path d="M11.5 11v-2a1 1 0 0 1 2 0v3.5a2.5 2.5 0 0 1-5 0V12"></path></svg>
    </button>
    <button aria-label="今日の項目（残り4項目）" title="今日の項目（⌥H）" style="position: relative; width: 44px; height: 44px; flex: none; border: 1px solid rgba(0,0,0,0.1); background: #FFFFFF; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#31302E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h11"></path><path d="M9 12h11"></path><path d="M9 18h11"></path><path d="M3.5 6l1.2 1.2L7 5"></path><path d="M3.5 12l1.2 1.2L7 11"></path><circle cx="5" cy="18" r="1.3"></circle></svg>
      <span style="position: absolute; top: -7px; right: -9px; height: 18px; padding: 0 5px; box-sizing: border-box; border-radius: 9999px; background: #F6F5F4; border: 1px solid rgba(0,0,0,0.1); color: #31302E; font-size: 11px; font-weight: 500; display: flex; align-items: center; white-space: nowrap">残4</span>
    </button>
    <label style="flex: 1; min-width: 0; display: block">
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">読み上げる文</span>
      <textarea rows="1" placeholder="打って Enter で読み上げ" title="Enter で読み上げ／Shift+Enter で改行" style="display: block; width: 100%; box-sizing: border-box; height: 44px; resize: none; border: 2px solid #097FE8; border-radius: 6px; padding: 10px 10px; font: inherit; font-size: 15px; line-height: 1.4; color: #191918; background: #FFFFFF; outline: none"></textarea>
    </label>
    <button style="height: 44px; padding: 0 16px; flex: none; border: none; background: #0075DE; color: #FFFFFF; border-radius: 6px; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer">話す</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":400,"height":860}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
